<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#12151a">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>সুর</title>
<script>try{var m=localStorage.getItem("sur.theme");if(m!=="light"&&m!=="dark")m="auto";document.documentElement.dataset.theme=m==="auto"?(matchMedia("(prefers-color-scheme:light)").matches?"light":"dark"):m}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 90 90'%3E%3Crect width='90' height='90' rx='22' fill='%231db954'/%3E%3Cpath d='M14 45C24 17 36 17 45 45S66 73 76 45' fill='none' stroke='black' stroke-width='11' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
 <aside id="side">
  <div class="logo"><svg class="mark" viewBox="0 0 90 90" aria-hidden="true"><rect width="90" height="90" rx="22" fill="#1db954"/><path d="M14 45C24 17 36 17 45 45S66 73 76 45" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round"/></svg><span class="lb">সুর</span></div>
  <button class="nav on" data-v="all"><svg viewBox="0 0 24 24"><path d="M4 4h4v16H4zm6 0h4v16h-4zm6 2.5 3.8-1 3.7 13.5-3.9 1z" transform="scale(.9) translate(1 1)"/></svg>Library</button>
  <button class="nav" data-v="albums"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 14a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-5.500a1.500 1.500 0 1 0 0 3 1.500 1.500 0 0 0 0-3z"/></svg>Albums</button>
  <button class="nav" data-v="liked"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.800-8 11-8 11z"/></svg>Liked Songs</button>
  <button class="nav mob" data-v="playlists"><svg viewBox="0 0 24 24"><path d="M3 6h12v2H3zm0 4h12v2H3zm0 4h8v2H3zm13-4v6.5a2.5 2.5 0 1 0 2 2.500V8h3V6h-5z"/></svg>Playlists</button>
  <div class="plh"><span>Playlists</span><button id="newPl" title="New playlist">＋</button></div>
  <div id="pls"></div>
  <button class="add" id="addF">＋ Add music</button>
  <div class="hint">Your files stay on your device. Drag and drop music anywhere, or press Space to play and pause.</div>
  <input type="file" id="fi" accept="audio/*,.mp3,.m4a,.flac,.wav,.ogg,.opus,.aac" multiple hidden>
  <input type="file" id="fd" webkitdirectory multiple hidden>
 </aside>

 <main id="main">
  <div id="drop">Drop music to add it</div>
  <div id="top"><div class="logo mlogo"><svg class="mark" viewBox="0 0 90 90" aria-hidden="true"><rect width="90" height="90" rx="22" fill="#1db954"/><path d="M14 45C24 17 36 17 45 45S66 73 76 45" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round"/></svg><span class="lb">সুর</span></div><div class="sw"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.500 7.500 0 0 1 5.900 12.100l4.300 4.300-1.400 1.400-4.300-4.300A7.500 7.500 0 1 1 10.500 3zm0 2a5.500 5.500 0 1 0 0 11 5.500 5.500 0 0 0 0-11z"/></svg><input id="q" placeholder="Search your songs" type="search"></div><button id="setBtn" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.800 7.800 0 0 0 0-2l2.100-1.600a.5.5 0 0 0 .1-.6l-2-3.500a.5.5 0 0 0-.6-.2l-2.500 1a7.400 7.400 0 0 0-1.700-1l-.4-2.600a.5.500 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.600c-.6.300-1.200.600-1.700 1l-2.500-1a.5.5 0 0 0-.6.200l-2 3.500a.5.5 0 0 0 .1.600L4.600 11a7.800 7.800 0 0 0 0 2l-2.100 1.600a.5.5 0 0 0-.1.600l2 3.500c.1.200.4.300.6.200l2.500-1c.5.400 1.100.700 1.700 1l.4 2.600c0 .2.200.4.500.4h4c.3 0 .5-.2.5-.4l.4-2.600c.6-.3 1.200-.6 1.700-1l2.500 1c.2.100.5 0 .6-.2l2-3.500a.5.5 0 0 0-.1-.6zM12 15.500a3.500 3.500 0 1 1 0-7 3.500 3.500 0 0 1 0 7z"/></svg></button><button id="addM" aria-label="Add songs">＋</button></div>
  <div id="hero"><div id="cover">♪</div><div><small>Playlist</small><h1 id="ttl">Your Library</h1><p id="sub">0 songs</p></div></div>
  <div id="actions">
   <button id="big" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
   <button class="ic" id="shuf2" title="Shuffle"><svg viewBox="0 0 24 24"><path d="M14 4h6v6l-2.300-2.300-3.700 3.700-1.400-1.400 3.700-3.700zM4 6h4l9 12h3v2h-4L7 8H4zm0 12h3l2.300-3.100 1.300 1.700L8.500 20H4zM14 20l2.300-2.300-1.700-1.700 1.400-1.400L18 16.600 20 14.600V20z" transform="scale(.9)"/></svg></button>
   <span id="plact" style="display:none;gap:10px"><button class="pill" id="plren">Rename</button><button class="pill" id="pldel">Delete</button></span>
  </div>
  <div id="list"></div>
 </main>

 <footer id="bar">
  <button id="npc" aria-label="Close player">⌄</button>
  <div id="now"><div class="art" id="nart" >♪</div><div style="min-width:0"><b id="nt">Nothing playing</b><span id="na">Add songs to begin</span></div></div>
  <div id="ctrl">
   <div class="btns">
    <button class="ic" id="shuf" title="Shuffle"><svg viewBox="0 0 24 24"><path d="M14 4h6v6l-2.300-2.300-3.700 3.700-1.400-1.400 3.700-3.700zM4 6h4l9 12h3v2h-4L7 8H4zm0 12h3l2.300-3.100 1.300 1.700L8.500 20H4zM14 20l2.300-2.300-1.700-1.700 1.400-1.400L18 16.600 20 14.600V20z" transform="scale(.9)"/></svg></button>
    <button class="ic" id="prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3.500 7L19 5v14z"/></svg></button>
    <button id="play" title="Play/Pause"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="ic" id="next" title="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 19V5l9.500 7z"/></svg></button>
    <button class="ic" id="rep" title="Repeat"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
   </div>
   <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
  </div>
  <div id="vol"><button class="ic" id="mute"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.500 3A4.500 4.500 0 0 0 14 8v8a4.500 4.500 0 0 0 2.500-4z"/></svg></button><input type="range" id="vr" min="0" max="100" value="80"></div>
 </footer>
</div>

<div id="set" role="dialog" aria-modal="true" aria-labelledby="sett"><div class="sbox">
 <div class="shead"><h3 id="sett">Settings</h3><button id="setx" aria-label="Close">✕</button></div>
 <section>
  <h4>Appearance</h4>
  <div class="seg" id="seg" role="group" aria-label="Theme"><button data-m="auto">Auto</button><button data-m="light">Light</button><button data-m="dark">Dark</button></div>
  <p class="sn">Auto follows your device's light or dark setting.</p>
 </section>
 <section>
  <div class="eqh"><h4>Equalizer</h4><label class="tog" aria-label="Turn equalizer on or off"><input type="checkbox" id="eqon"><span></span></label></div>
  <div class="eqrow"><select id="eqpre" aria-label="Equalizer preset"></select><button class="pill" id="eqreset">Reset</button></div>
  <div id="eqb" class="eqb"></div>
  <p class="sn" id="eqnote"></p>
 </section>
</div></div>
<div id="menu"></div><div id="toast"></div>
<div id="dlg"><div class="box"><h3 id="dt"></h3><input id="di" maxlength="60" placeholder="Playlist name"><div class="bt"><button id="dc">Cancel</button><button id="dok">Save</button></div></div></div>
<script src="script.js"></script>
</body>
</html>
